# ============================================================
# Supabase Keepalive (Cloud) - GitHub Actions
# Purpose: prevent free-tier project pause from inactivity.
# Cloud runs are independent of this PC being on.
# Rhythm: ~3 days x 2 pings, alternated via two cron entries:
#   - day 1/4/7... at 06:30 UTC
#   - day 2/5/8... at 18:30 UTC
# Each run: REST query + Auth ping via curl (real DB activity).
# ============================================================
name: Supabase Keepalive

on:
  schedule:
    - cron: "30 6 1/3 * *"     # day 1,4,7,... 06:30 UTC
    - cron: "30 18 2/3 * *"    # day 2,5,8,... 18:30 UTC
  workflow_dispatch: {}        # manual trigger

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase (REST + Auth via curl)
        run: |
          # Read project URL and anon key from config.js (anon key is public by design)
          URL=$(grep -oP "url: \x27\K[^\x27]+" config.js)
          ANON=$(grep -oP "anonKey: \x27\K[^\x27]+" config.js)
          if [ -z "$ANON" ]; then echo "ERROR: anon key not found in config.js"; exit 1; fi
          echo "Project: $URL"
          echo -n "REST: "
          curl -s -o /dev/null -w "%{http_code}\n" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "$URL/rest/v1/forum_topics?select=id&limit=1"
          echo -n "AUTH: "
          curl -s -o /dev/null -w "%{http_code}\n" "$URL/auth/v1/health"
